let cardIndex = 0;

function showAnswer() {
    document.getElementById("answer").style.display = "block";
}

function nextCard() {
    cardIndex = (cardIndex + 1) % flashcards.length;

    document.getElementById("question").textContent =
        flashcards[cardIndex].question;

    document.getElementById("answer").textContent =
        flashcards[cardIndex].answer;

    document.getElementById("answer").style.display = "none";
}

const quizzes = [
    {
        question: "Which organelle produces ATP?",
        options: ["Nucleus", "Mitochondria", "Ribosome", "Golgi"],
        answer: "Mitochondria"
    },
    {
        question: "What is the genetic material of most organisms?",
        options: ["RNA", "Protein", "DNA", "Lipids"],
        answer: "DNA"
    },
    {
        question: "Which process produces glucose in plants?",
        options: ["Respiration", "Photosynthesis", "Fermentation", "Mitosis"],
        answer: "Photosynthesis"
    }
];

let quizIndex = 0;
let score = 0;
let answered = false;

function loadQuiz() {
    answered = false;

    const quiz = quizzes[quizIndex];

    document.getElementById("quizQuestion").textContent =
        quiz.question;

    document.getElementById("result").textContent = "";

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    quiz.options.forEach(option => {
        const button = document.createElement("button");

        button.textContent = option;
        button.className = "option";

        button.onclick = () => checkAnswer(option);

        optionsDiv.appendChild(button);
    });
}

function checkAnswer(option) {
    if (answered) return;

    answered = true;

    const correct = quizzes[quizIndex].answer;

    if (option === correct) {
        score++;
        document.getElementById("result").textContent =
            "Correct! 🎉";
    } else {
        document.getElementById("result").textContent =
            "Incorrect. Answer: " + correct;
    }

    document.getElementById("score").textContent =
        "Score: " + score;
}

function nextQuiz() {
    quizIndex = (quizIndex + 1) % quizzes.length;
    loadQuiz();
}
